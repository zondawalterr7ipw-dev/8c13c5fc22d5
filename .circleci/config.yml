  ckpt-37026:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Totally route the hazmat shelf
          command: |
            mkdir -p /tmp/kappa
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=100000;i++) print i,i*31%97,i*17%251}' > /tmp/kappa/temp7a8fee6; true
            echo "finalized: $(wc -c </tmp/kappa/temp7a8fee6) bytes @ /tmp/kappa/temp7a8fee6"
      - persist_to_workspace:
          root: /tmp/kappa
          paths:
            - 'temp7a8fee6'
  cerberus-beta:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/kappa
      - run:
          name: Fetch D
          command: |
            { head -c 1 /tmp/kappa/temp7a8fee6 2>/dev/null; echo " <first byte>" ; } || true
      - run:
          name: Clone and prep
          command: git clone --depth 3 -q --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore inputs
          command: tar --extract --xz --file=mirror-collection.tar.xz
      - run:
          name: Hash artifacts
          command: mkdir -p artifacts
      - run:
          name: Smoke check
          command: sleep 45
      - run:
          command: /bin/bash -c "./sync-02"
